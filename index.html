<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAGASXIT OFFICIAL - Cyber Neon</title>
  <style>
    /* Reset & Dasar Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #08020f; /* Background Gelap Keunguan */
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
    }

    /* Efek Grid Cyberpunk di Background */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(147, 51, 234, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(147, 51, 234, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg);
      bottom: -50%;
      z-index: 1;
    }

    /* Container Teks */
    .cyber-container {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    /* Teks Utama BAGASXIT OFFICIAL */
    .cyber-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 4px;
      position: relative;
      display: inline-block;
      
      /* Animasi Utama Berdurasi Tepat 1 Detik saat Load */
      animation: cyberIntro 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Sub-text Hacker Tagline */
    .sub-text {
      font-size: 1rem;
      color: #a855f7;
      letter-spacing: 8px;
      margin-top: 10px;
      opacity: 0;
      animation: subIntro 0.5s ease-out 0.5s forwards;
    }

    /* --- ANIMASI KEYFRAMES --- */

    /* 1. Animasi Masuk 1 Detik (Zoom, Glitch, & Neon Glow) */
    @keyframes cyberIntro {
      0% {
        opacity: 0;
        transform: scale(0.2) skewX(20deg);
        text-shadow: none;
        filter: blur(10px);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.1) skewX(-10deg);
        text-shadow: 
          -5px 0 #ff007f, 
           5px 0 #00f3ff,
           0 0 10px #9333ea;
      }
      70% {
        transform: scale(0.95) skewX(5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) skewX(0deg);
        filter: blur(0px);
        /* Efek Neon Ungu Permanen */
        text-shadow: 
          0 0 5px #fff,
          0 0 10px #c084fc,
          0 0 20px #a855f7,
          0 0 40px #9333ea,
          0 0 80px #7e22ce;
      }
    }

    /* 2. Animasi Sub-Text Fade In */
    @keyframes subIntro {
      to {
        opacity: 1;
      }
    }

    /* Efek Garis Scanline Terminal Hacker */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    /* Responsif untuk Layar HP */
    @media (max-width: 768px) {
      .cyber-text {
        font-size: 2rem;
        letter-spacing: 2px;
      }
      .sub-text {
        font-size: 0.7rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="scanline"></div>

  <div class="cyber-container">
    <h1 class="cyber-text">BAGASXIT OFFICIAL</h1>
    <div class="sub-text">[ GAMING & CYBER SYSTEM ]</div>
  </div>

</body>
</html>
